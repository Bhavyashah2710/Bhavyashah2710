<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="tlLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#79C0FF" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="260" fill="#0D1117"/>
  <line x1="90" y1="90" x2="1110" y2="90" stroke="url(#tlLine)" stroke-width="2"/>

  <!-- Node 1 -->
  <g transform="translate(150,90)">
    <circle r="9" fill="#0D1117" stroke="#58A6FF" stroke-width="3"/>
    <text x="0" y="-28" text-anchor="middle" fill="#58A6FF" font-size="13" letter-spacing="2" font-weight="700">01</text>
    <text x="0" y="45" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="700">Started B.Tech CSE (AI)</text>
    <text x="0" y="66" text-anchor="middle" fill="#8B949E" font-size="12.5">Parul University</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(430,90)">
    <circle r="9" fill="#0D1117" stroke="#58A6FF" stroke-width="3"/>
    <text x="0" y="-28" text-anchor="middle" fill="#58A6FF" font-size="13" letter-spacing="2" font-weight="700">02</text>
    <text x="0" y="45" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="700">Built DSA Foundations</text>
    <text x="0" y="66" text-anchor="middle" fill="#8B949E" font-size="12.5">Java + Data Structures &amp; Algorithms</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(730,90)">
    <circle r="10" fill="#58A6FF"/>
    <text x="0" y="-28" text-anchor="middle" fill="#79C0FF" font-size="13" letter-spacing="2" font-weight="700">03</text>
    <text x="0" y="45" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="700">300+ Problems &amp; Hackathons</text>
    <text x="0" y="66" text-anchor="middle" fill="#8B949E" font-size="12.5">Shipped projects under real deadlines</text>
  </g>

  <!-- Node 4 (current, pulsing) -->
  <g transform="translate(1010,90)">
    <circle r="14" fill="none" stroke="#79C0FF" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="10;18;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" fill="#79C0FF"/>
    <text x="0" y="-28" text-anchor="middle" fill="#79C0FF" font-size="13" letter-spacing="2" font-weight="700">NOW</text>
    <text x="0" y="45" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="700">Building AI &amp; Web Projects</text>
    <text x="0" y="66" text-anchor="middle" fill="#8B949E" font-size="12.5">Backend dev + Open source</text>
  </g>
</svg>
